  - pip:
      - django >=2.2,<3.0
      - psycopg2 <2.9
      - django-allauth
      - django-countries
      - django-requestlogging
      - PyJWT
      # EOxServer dependencies
      - python-dateutil
      - django-model-utils <5.0.0
      - django-utils-six ==2.0
      - django-prometheus
      - tzdata
      - zipstream
      - lxml
      - pycql ==0.0.8
      - pyows >=0.2.6
      - python-keystoneclient <6.0.0
      - python-swiftclient <5.0.0
      - jsonfield

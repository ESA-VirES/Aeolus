dependencies:
  - python >=3.8,<3.9
  - pip
  - jinja2
  # - psycopg2 <2.9 # Required by Django 2.2 cannot be installed conda-forge
  - setproctitle
  - gunicorn < 22
  - pycurl
  - jinja2
  - jsonschema
  - pyyaml
  - redis-py
  - ply
  - msgpack-python  # <0.6
  - numpy  # <1.20
  - scipy  # <1.6
  - matplotlib
  # EOxServer dependencies
  - sqlite
  - libspatialite
  - gdal
  - mapserver
  # Aeolus dependencies
  - netcdf4
  - coda
  # Required by pip psycopg2 installation
  - c-compiler
